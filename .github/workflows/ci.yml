name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: API · lint, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: resolvia
          POSTGRES_PASSWORD: resolvia_test
          POSTGRES_DB: resolvia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resolvia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resolvia:resolvia_test@localhost:5432/resolvia_test?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v4

      - name: Verificar si la API ya existe
        id: check
        working-directory: .
        run: |
          if [ -f apps/api/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Instalar dependencias
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Migraciones de base de datos
        if: steps.check.outputs.exists == 'true' && hashFiles('apps/api/prisma/schema.prisma') != ''
        run: npx prisma migrate deploy

      - name: Pruebas
        if: steps.check.outputs.exists == 'true'
        run: npm test --if-present -- --coverage

      - name: Pruebas e2e
        if: steps.check.outputs.exists == 'true'
        run: npm run test:e2e --if-present

      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build --if-present

  web:
    name: Web · lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Verificar si la web ya existe
        id: check
        working-directory: .
        run: |
          if [ -f apps/web/package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar, lint y build
        if: steps.check.outputs.exists == 'true'
        run: |
          npm ci
          npm run lint --if-present
          npm run build
